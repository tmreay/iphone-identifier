name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step runs even if an earlier one failed, so a single CI run
      # reports every problem rather than just the first.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # D-11: the matrix must trace to reference/. This regenerates it and fails
      # if the committed file differs.
      - name: Check the matrix against reference/
        if: ${{ !cancelled() }}
        run: npm run transcribe:check

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
