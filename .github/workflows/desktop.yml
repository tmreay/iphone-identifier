name: Desktop

# Builds the Tauri desktop bundles (SPEC.md D-27). Two ways in:
#
#   push a v* tag   build every platform and open a draft release
#   run it by hand  build the chosen platforms; release only if asked
#
# Building and releasing are separate: only a tag push or an explicit
# `release: true` publishes anything. A manual run leaves the installers as
# downloadable workflow artifacts.
#
# Deliberately not on pull_request. A Rust compile costs minutes on three
# runners where ci.yml costs seconds, and the shell it builds is a window
# around a bundle ci.yml already checks -- so paying that on every PR buys
# almost nothing. Run this by hand when the shell itself changes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: windows
        options:
          - windows
          - all
      release:
        description: Publish the bundles as a draft GitHub release
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: plan
        name: Decide what to build and whether to release
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          WANTS_RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Windows is the target that matters (SPEC.md §2); the rest are
          # welcome but never the reason a run exists, so they are the ones
          # dropped when a run does not need the full set.
          windows='{"name":"windows","os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          all="$windows"',{"name":"macos-arm","os":"macos-latest","target":"aarch64-apple-darwin"}'
          all="$all"',{"name":"macos-intel","os":"macos-13","target":"x86_64-apple-darwin"}'
          all="$all"',{"name":"linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}'

          release=false
          tag=''

          case "$EVENT" in
            push)
              # A tag push is the release path: everything, every platform.
              release=true
              tag="$REF_NAME"

              # The version baked into the binaries comes from package.json, so
              # a tag that disagrees with it ships an app that misreports itself.
              version=$(node -p "require('./package.json').version")
              if [ "$tag" != "v$version" ]; then
                echo "::error::Tag $tag does not match package.json version $version. Expected v$version."
                exit 1
              fi

              set_matrix="[$all]"
              ;;
            workflow_dispatch)
              release="$WANTS_RELEASE"
              # No tag exists yet on a manual release; tauri-action fills
              # __VERSION__ in from package.json and creates the tag itself.
              # An `&&` one-liner would exit non-zero here under `set -e` on
              # every build-only run, which is the common case.
              if [ "$release" = true ]; then tag='v__VERSION__'; fi
              if [ "$PLATFORMS" = all ]; then set_matrix="[$all]"; else set_matrix="[$windows]"; fi
              ;;
            *)
              # Unreachable: the two triggers above are the only ones declared.
              # If a third is ever added, build the platform that matters and
              # publish nothing, rather than guessing.
              set_matrix="[$windows]"
              ;;
          esac

          echo "matrix=$set_matrix" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          names=$(MATRIX="$set_matrix" node -p "JSON.parse(process.env.MATRIX).map(e => e.name).join(', ')")
          {
            echo "**Building:** $names"
            echo ""
            if [ "$release" = true ]; then
              echo "**Releasing:** yes, as a draft on tag \`$tag\`."
            else
              echo "**Releasing:** no. Bundles are attached to this run as artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      # Needed only on the release path, and job-level `permissions` cannot take
      # an expression. Pull requests get a read-only token regardless of what is
      # written here, and every other path is gated behind the `release` output.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # webkit2gtk is the Linux webview; the rest are what the AppImage and deb
      # bundlers shell out to. 22.04 rather than latest so the binaries run on
      # older glibc than the runner's own.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file wget patchelf \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Runs `npm run build` first via tauri.conf.json's beforeBuildCommand, so
      # the bundle it packages is the same one the web build produces.
      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Empty tagName means build only - tauri-action skips the release
          # entirely rather than publishing a half-named one.
          tagName: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.tag || '' }}
          releaseName: iPhone Identifier __VERSION__
          releaseBody: |
            Desktop builds of the iPhone Identifier (SPEC.md §5.1).

            Windows: `.exe` is the NSIS installer, `.msi` the Windows Installer package.
            macOS: `.dmg`, one per architecture - `aarch64` for Apple silicon, `x64` for Intel.
            Linux: `.AppImage` runs anywhere, `.deb` for Debian and Ubuntu.

            The app is offline-only and talks to nothing.
          releaseDraft: true
          prerelease: false
          # No updater is configured, so there is no latest.json to publish.
          includeUpdaterJson: false

      # Windows ships two things that do different jobs: an MSI for deploying
      # across machines, and the bare binary, which is the whole app -- Tauri
      # compiles the frontend into it, so it runs from anywhere with nothing
      # beside it.
      #
      # Both are renamed here, because an unarchived upload takes its artifact
      # name from the filename and ignores `name:`. The filename is therefore
      # the only label available, and "portable" versus "installer" is the one
      # distinction someone downloading these needs to make.
      - name: Stage the Windows downloads
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          release="src-tauri/target/${{ matrix.target }}/release"
          version=$(node -p "require('./package.json').version")
          mkdir -p downloads

          cp "$release"/bundle/msi/*.msi \
             "downloads/iPhone Identifier_${version}_x64_installer.msi"
          cp "$release/iphone-identifier.exe" \
             "downloads/iPhone Identifier_${version}_x64_portable.exe"

          echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size | What it is |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          printf '| `%s` | %s | Run it. No install. |\n' \
            "iPhone Identifier_${version}_x64_portable.exe" \
            "$(du -h "downloads/iPhone Identifier_${version}_x64_portable.exe" | cut -f1)" \
            >> "$GITHUB_STEP_SUMMARY"
          printf '| `%s` | %s | For scripted or group-policy deployment. |\n' \
            "iPhone Identifier_${version}_x64_installer.msi" \
            "$(du -h "downloads/iPhone Identifier_${version}_x64_installer.msi" | cut -f1)" \
            >> "$GITHUB_STEP_SUMMARY"

      # The build-without-release path. Each file is uploaded on its own with
      # `archive: false`, so the Actions page offers it as the file itself
      # rather than a zip to download and unpack.
      #
      # That mode takes exactly one file per step, which is why these are
      # separate steps rather than one glob. The `if-no-files-found: error`
      # guard means a bundler that moves its output fails the run rather than
      # quietly uploading nothing.
      - name: Upload the portable app
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'Windows' }}
        # v6 is the first major that actually runs on Node 24 -- v5 only had
        # preliminary support and still declares `using: node20`, so the runner
        # forces it onto 24 and warns. Every other action here is already node24.
        uses: actions/upload-artifact@v7
        with:
          path: downloads/*_portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows installer
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          path: downloads/*_installer.msi
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the macOS disk image
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Linux AppImage
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Debian package
        if: ${{ needs.plan.outputs.release != 'true' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 14
